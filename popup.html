<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Apex Leads Extractor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M12 2c-3.87 0-7 3.13-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#fff"/>
            <circle cx="12" cy="9" r="2.6" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Apex Leads Extractor</h1>
          <p class="subtitle">Google Maps · 30 países</p>
        </div>
      </div>
      <div class="header-links">
        <button type="button" class="link-btn" id="btnAbrirResultados">Resultados</button>
        <button type="button" class="link-btn" id="btnAbrirOpcoes">Opções</button>
      </div>
    </header>

    <section class="card">
      <label class="field-label" for="termosBusca">Termos de busca (um por linha)</label>
      <textarea id="termosBusca" class="text-input" rows="3" placeholder="ex.: loja de bicicletas"></textarea>
    </section>

    <section class="card">
      <div class="field-label">1. Escolha o país</div>
      <div class="flags-grid" id="flagsGrid"></div>
    </section>

    <section class="card" id="cardEstado" hidden>
      <label class="field-label" for="selectEstado">2. Escolha o estado/província</label>
      <select id="selectEstado" class="text-input"></select>
    </section>

    <section class="card" id="cardCidades" hidden>
      <div class="group-header">
        <span class="field-label" id="tituloCidades">3. Cidades</span>
      </div>
      <input type="text" class="text-input filter-input" id="filtroCidades" placeholder="Filtrar cidades...">
      <div class="group-actions">
        <button type="button" class="btn-small" id="marcarEstadoInteiro">Marcar estado inteiro</button>
        <button type="button" class="btn-small" id="limparEstado">Desmarcar estado</button>
      </div>
      <div class="list-hint" id="subPrincipais"></div>
      <div class="checkbox-list" id="listaCidades"></div>
    </section>

    <section class="card">
      <div class="selection-counter" id="selectionCounter">0 cidades selecionadas</div>
    </section>

    <section class="card">
      <div class="field-label">Modo de Execução</div>
      <label class="radio-row">
        <input type="radio" name="modoExecucao" value="blocos" checked>
        <span>Executar em Blocos (pausa a cada 5 cidades)</span>
      </label>
      <label class="radio-row">
        <input type="radio" name="modoExecucao" value="continuo">
        <span>Executar Tudo (Contínuo)</span>
      </label>
      <label class="radio-row">
        <input type="checkbox" id="chkAcumular">
        <span>Acumular com a coleta anterior (não zera os leads)</span>
      </label>
    </section>

    <section class="card controls">
      <button type="button" class="btn-primary" id="btnIniciar">Iniciar</button>
      <button type="button" class="btn-secondary" id="btnPausar" disabled>Pausar</button>
      <button type="button" class="btn-danger" id="btnParar" disabled>Parar e Exportar</button>
    </section>

    <section class="card controls">
      <button type="button" class="btn-secondary" id="btnExportarAgora" disabled>Exportar agora</button>
      <button type="button" class="btn-secondary" id="btnRepetirFalhas" hidden>Repetir falhas</button>
      <button type="button" class="btn-danger" id="btnNovaBusca">Nova busca (zerar tudo)</button>
    </section>

    <section class="card dashboard">
      <div class="status-line" id="statusLine" aria-live="polite">Ocioso.</div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBarInner"></div>
      </div>
      <div class="counters-row">
        <span id="counterLeads">Leads únicos: 0</span>
        <span id="counterTarefas">Buscas: 0/0</span>
      </div>
      <div class="counters-row">
        <span id="counterCidades">Cidades concluídas: 0/0</span>
        <span id="counterFalhas"></span>
      </div>
      <div class="eta-line" id="etaLine"></div>
      <div class="log-area" id="logArea"></div>
    </section>
  </div>

  <script src="data/paises/index.js"></script>
  <script src="popup.js"></script>
</body>
</html>
